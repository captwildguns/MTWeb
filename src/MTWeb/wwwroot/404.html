<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MT Web</title>
  <script>
    // Redirect unknown paths back to index.html, preserving the route in the query string
    // so the Blazor router can handle it. Keeps 1 path segment (/MTWeb/).
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
