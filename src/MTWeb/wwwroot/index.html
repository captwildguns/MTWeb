<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MT Web</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Tyler.Forge.Blazor/dist/styles.css" />
    <link rel="stylesheet" href="_content/TylerTechnologies.Transportation.Components/forge-tailwind.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <script>
        // Restore path redirected through 404.html for GitHub Pages SPA routing
        (function() {
            var p = window.location.search.slice(1).split('&').filter(function(s) { return s.startsWith('p='); })[0];
            if (p) {
                var path = p.slice(2).replace(/~and~/g, '&');
                window.history.replaceState(null, null, '/' + (window.location.pathname.split('/')[1] || '') + '/' + path + window.location.hash);
            }
        })();
    </script>
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;">
            <forge-circular-progress></forge-circular-progress>
        </div>
    </div>
    <div id="blazor-error-ui" role="alert">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">&#10006;</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
